<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fruits Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Fresh Fruits Shop</h1>
        <p>Product Information Retrieval</p>
    </header>

    <section id="price-table">
        <h2>Product Price Table</h2>
        <table id="product-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Unit</th>
                    <th>Availability</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table content will be filled by JavaScript -->
            </tbody>
        </table>
    </section>

    <section id="product-info">
        <h2>Product Details</h2>
        <form id="product-form">
            <label for="product-select">Select Product:</label>
            <select id="product-select">
                <!-- Options will be filled by JavaScript -->
            </select>
            <button type="button" id="show-info-btn">Show Product Info</button>
        </form>

        <div id="product-details-container">
            <!-- Product details will be shown here -->
        </div>
    </section>

    <footer>
        <p>Fresh Fruits Shop &copy; 2023</p>
        <p>Address: Fruit Street 123, Athens | Phone: 210 1234567 | Email: info@freshfruits.gr</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
